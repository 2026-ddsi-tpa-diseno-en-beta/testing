name: Contratos y MCP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  observabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar reglas y escenarios de alertas
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 check config prometheus.render.example.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 check config prometheus.rabbitmq.example.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 test rules alertas.test.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/observabilidad:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/observabilidad:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.telegram.example.yml
  integracion-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: testing
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/mcp-server
          ref: 82488d9867753f0833af2d840d8342be45331b0b
          path: mcp-server
      # Reproducible set of the four service versions verified for entrega 5.
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/donaciones
          ref: bfbcc50f7d5bbeaac0792db8446e6f32bed62ccd
          path: donaciones
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Donadores-Y-Entidades
          ref: 5d1fca8ad9c5b362ea60c5fbe5d0f8c48df5f4c4
          path: Donadores-Y-Entidades
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Componente_Logistica
          ref: 29d49ff3c2842a47fe5da53282e15231abe505b7
          path: Componente_Logistica
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Incentivos
          ref: f585a5f283e791fd9f5a4258cd976947b7ca3952
          path: Incentivos
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar catálogo compartido
        run: cmp testing/contratos/tools.json mcp-server/src/main/resources/tools.json
      - name: Compilar servicios y MCP
        run: |
          mvn -B -DskipTests -f donaciones/pom.xml package
          mvn -B -DskipTests -f Donadores-Y-Entidades/pom.xml package
          mvn -B -DskipTests -f Componente_Logistica/pom.xml package
          mvn -B -DskipTests -f Incentivos/pom.xml package
          mvn -B -f mcp-server/pom.xml package
      - name: Ejecutar seis flujos a través de MCP
        run: python testing/local/probar_integracion_mcp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-mcp
          path: tmp/revision-entrega5/integracion-mcp
