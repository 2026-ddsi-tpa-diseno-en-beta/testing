name: Contratos y MCP
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      logistica_ref:
        description: 'Ref publicada de Logística; vacío usa la revisión validada'
        required: false
        default: '573182f361d763d53b4c2de59ce09120cdd26ac5'
      donadores_ref:
        description: 'Ref publicada de Donadores y Entidades; vacío usa la revisión validada'
        required: false
        default: '6e2c4870279beceb67988873054757dc07c8a3d3'
      mcp_ref:
        description: 'Ref publicada de MCP; vacío usa la revisión validada'
        required: false
        default: 'edcbf8f74e14f62a667f331dedc8ba318989863e'
permissions:
  contents: read
jobs:
  observabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar reglas y escenarios de alertas
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 check config prometheus.render.example.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 check config prometheus.rabbitmq.example.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/observabilidad:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.5.0 test rules alertas.test.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/observabilidad:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/observabilidad:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.telegram.example.yml
  integracion-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: testing
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/mcp-server
          ref: ${{ inputs.mcp_ref || 'edcbf8f74e14f62a667f331dedc8ba318989863e' }}
          path: mcp-server
      # Los componentes sin cambios conservan versiones publicadas y auditadas.
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/donaciones
          ref: f91e3bfe2e2b9214e576bf918eedebfafbdfdbb2
          path: donaciones
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Donadores-Y-Entidades
          ref: ${{ inputs.donadores_ref || '6e2c4870279beceb67988873054757dc07c8a3d3' }}
          path: Donadores-Y-Entidades
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Componente_Logistica
          ref: ${{ inputs.logistica_ref || '573182f361d763d53b4c2de59ce09120cdd26ac5' }}
          path: Componente_Logistica
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Incentivos
          ref: 78b7d013666ff4bca11edb0bbb13e390d0da6fad
          path: Incentivos
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar catálogo compartido
        run: |
          python testing/ci/registrar_versiones.py testing/local/versiones-ci.json testing donaciones Donadores-Y-Entidades Componente_Logistica Incentivos mcp-server
          cmp testing/contratos/tools.json mcp-server/src/main/resources/tools.json
      - name: Compilar servicios y MCP
        run: |
          mvn -B -f donaciones/pom.xml package
          mvn -B -f Donadores-Y-Entidades/pom.xml package
          mvn -B -f Componente_Logistica/pom.xml package
          mvn -B -f Incentivos/pom.xml package
          mvn -B -f mcp-server/pom.xml package
      - name: Ejecutar seis flujos a través de MCP
        run: python testing/local/probar_integracion_mcp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-mcp
          path: |
            tmp/revision-entrega5/integracion-mcp
            testing/local/versiones-ci.json
            '**/target/surefire-reports/'
