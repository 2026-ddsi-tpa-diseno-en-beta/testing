name: Ensayo integrado entrega 6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {path: testing}
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/donaciones
          ref: f91e3bfe2e2b9214e576bf918eedebfafbdfdbb2
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: donaciones
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Donadores-Y-Entidades
          ref: 7e79e6118575b96a4e2e8b81f42a56e2b7ac5ad3
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: Donadores-Y-Entidades
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Componente_Logistica
          ref: 2cb1b50ec83810aee5beb4fce1c2406479e9c086
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: Componente_Logistica
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Incentivos
          ref: 78b7d013666ff4bca11edb0bbb13e390d0da6fad
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: Incentivos
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/API_Gateway
          ref: 10e35b1c2a7a1b5e5c56e42d39f1a573a7705f70
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: API_Gateway
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/Servicio_de_Consultas
          ref: 43c28169ca843b2e45b4d66678a6c80a1232bc83
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: Servicio_de_Consultas
      - uses: actions/checkout@v4
        with:
          repository: 2026-ddsi-tpa-diseno-en-beta/mcp-server
          ref: a5e3075f1eaa8f90cf7d547b06aa812839581e39
          token: ${{ secrets.DONATRACK_READ_TOKEN || github.token }}
          path: mcp-server
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: '**/pom.xml'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Registrar versiones y comprobar contrato
        run: |
          for repo in donaciones Donadores-Y-Entidades Componente_Logistica Incentivos API_Gateway Servicio_de_Consultas mcp-server; do git -C "$repo" rev-parse HEAD; done
          cmp mcp-server/src/main/resources/tools.json testing/contratos/tools.json
          mvn -B -ntp -f mcp-server/pom.xml package
      - name: Levantar entorno real
        working-directory: testing/entrega6
        run: docker compose up -d --build
      - name: Ensayar por HTTP y MCP
        run: |
          python testing/entrega6/probar_demo.py --timeout 180
          python testing/entrega6/probar_demo.py --mcp --timeout 180
      - name: Guardar evidencia y logs
        if: always()
        run: docker compose -f testing/entrega6/compose.yaml logs --no-color > testing/entrega6/evidencia-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-entrega6
          path: |
            testing/entrega6/evidencia.local/
            testing/entrega6/evidencia-compose.log
      - name: Detener entorno
        if: always()
        working-directory: testing/entrega6
        run: docker compose down
