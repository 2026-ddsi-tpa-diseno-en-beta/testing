global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alertas.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: donaciones
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["donaciones.example.com:443"]
        labels: {component: donaciones}
  - job_name: donadores
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["donadores.example.com:443"]
        labels: {component: donadores}
  - job_name: logistica
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["logistica.example.com:443"]
        labels: {component: logistica}
  - job_name: incentivos
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incentivos.example.com:443"]
        labels: {component: incentivos}
  # Workers must expose HTTP endpoints (for example, Render Web Services).
  # Background Workers without an HTTP URL need a push exporter instead.
  - job_name: workers
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker-1.example.com:443", "worker-2.example.com:443"]
        labels: {component: worker}
