groups:
  - name: donatrack
    rules:
      - alert: ComponenteNoDisponible
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No responde {{ $labels.component }}"
          description: "Revisar salud y logs del componente antes de iniciar la demo."
      - alert: FallosDeIntegracion
        expr: (sum by (component) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by (component) (rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05) and on (component) sum by (component) (increase(http_server_requests_seconds_count[5m])) >= 5
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Errores HTTP en {{ $labels.component }}"
      - alert: DonacionesRechazadas
        expr: (sum(rate(donatrack_donaciones_rechazadas_total[5m])) / clamp_min(sum(rate(donatrack_donaciones_registradas_total[5m]) + rate(donatrack_donaciones_rechazadas_total[5m])), 0.001) > 0.3) and on () sum(increase(donatrack_donaciones_registradas_total[5m]) + increase(donatrack_donaciones_rechazadas_total[5m])) >= 5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Mas del 30% de las donaciones son rechazadas"
          description: "Revisar estados de donadores y metricas de quejas."
      - alert: MatchmakingDetenido
        expr: logistica_paquetes_pendientes > 0 and on () (sum(increase(logistica_asignaciones_matchmaking_total[5m])) + sum(increase(logistica_matchmaking_sin_asignacion_total[5m]))) == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Hay paquetes pendientes sin progreso del matchmaking"
          description: "Revisar workers, conexion al broker y DLQ."
      - alert: DepositosCasiLlenos
        expr: logistica_depositos_ocupacion / clamp_min(logistica_depositos_capacidad, 1) > 0.9
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Deposito {{ $labels.deposito }} con ocupacion superior al 90%"
      - alert: MisionesRevocadas
        expr: increase(donatrack_incentivos_misiones_revocadas_total[10m]) >= 3
        labels: {severity: warning}
        annotations:
          summary: "Tres o mas revocaciones de misiones en diez minutos"
          description: "Correlacionar con quejas recientes en los logs."
      - alert: CronIncentivosConErrores
        expr: increase(donatrack_incentivos_cron_errores_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "El cron no pudo procesar uno o mas donadores"
      - alert: WorkerConErrores
        expr: sum by (component, worker_id) (increase(logistica_worker_errores_total{component="worker"}[5m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Errores de matchmaking en {{ $labels.worker_id }}"
          description: "Revisar reintentos, callback HTTP y DLQ del broker."
      - alert: EntregasDemoradas
        expr: logistica_asignaciones_pendientes_antiguedad_seconds > 86400
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Hay asignaciones sin entregar hace mas de 24 horas"
          description: "Revisar paquetes asignados y coordinar la entrega; reserva no significa entrega."
      - alert: CronSinEjecucionExitosa
        expr: (time() - donatrack_incentivos_cron_ultima_ejecucion_exitosa_seconds > 300) and on (job, instance) (time() - process_start_time_seconds > 300)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Incentivos no completa un ciclo exitoso hace mas de cinco minutos"
          description: "Umbral pensado para intervalo de 60 segundos; ajustarlo si cambia el cron."
      - alert: MensajesEnDLQ
        expr: rabbitmq_queue_messages{queue="logistica.matchmaking.dlq"} > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Hay mensajes de Logistica en la cola de errores"
          description: "Revisar el fallo antes de reintentar; no purgar la cola. Requiere metricas por cola del broker."
