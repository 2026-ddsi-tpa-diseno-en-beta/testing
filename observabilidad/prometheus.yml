global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alertas.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: donaciones
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: {component: donaciones}
  - job_name: donadores
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels: {component: donadores}
  - job_name: logistica
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels: {component: logistica}
  - job_name: incentivos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels: {component: incentivos}
