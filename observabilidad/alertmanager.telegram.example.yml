# Copy to alertmanager.telegram.local.yml and set the group's numeric chat ID.
route:
  receiver: telegram
  group_by: [alertname, component]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 123456789
        send_resolved: true
        parse_mode: HTML
        message: |-
          {{ if eq .Status "firing" }}⚠️ Alerta activa{{ else }}✅ Alerta resuelta{{ end }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          Componente: {{ .Labels.component }}
          {{ end }}
