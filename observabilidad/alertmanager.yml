route:
  receiver: consola
  group_by: [alertname, component]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
receivers:
  # Las alarmas se consultan en http://localhost:9093. Agregar un receptor real
  # (email/Telegram/webhook) con las credenciales del grupo para notificaciones.
  - name: consola
